name: Build macOS self-use DMG

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-self-use-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build WarpOss (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare macOS build environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_release_deps: true
          cache_key: self-use-macos-arm64

      - name: Ensure arm64 Rust target is installed
        run: rustup target add aarch64-apple-darwin

      - name: Install cargo-bundle
        run: ./script/install_cargo_bundle

      - name: Install create-dmg
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg

      - name: Build ad-hoc signed DMG
        id: bundle
        run: >-
          ./script/bundle
          --channel oss
          --features terminal_only
          --arch aarch64
          --selfsign
          --dmg-name-suffix arm64

      - name: Verify bundle
        env:
          DMG_PATH: ${{ steps.bundle.outputs.dmg_path }}
          APP_PATH: target/release-lto/bundle/osx/WarpOss.app
        run: |
          test -f "$DMG_PATH"
          test -d "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/warp-oss")" = "arm64"
          shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: warp-oss-macos-arm64-${{ github.sha }}
          path: |
            ${{ steps.bundle.outputs.dmg_path }}
            ${{ steps.bundle.outputs.dmg_path }}.sha256
          if-no-files-found: error
          retention-days: 30
